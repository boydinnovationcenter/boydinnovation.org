# Tech on Tap page (https://boydinnovation.org/tech-on-tap). See CONTENT.md.

techOnTap:
  seo:
    title: "Tech on Tap | Boyd Innovation"
    # Empty on the live site.
    description: ""
    ogImage: "https://boydinnovation.org/og/boyd-innovation-logo.png"

  hero:
    heading: "Tech On Tap"
    # Tech on Tap is paused until January 2027. When the next session is set, remove
    # the # from these lines and fill them in:
    # - start / end: Eastern time, 24-hour clock. Not shown on the page; tells search
    #   engines when the session is.
    # - register: the Eventbrite event (the id is the number at the end of the link).
    #   Shows the Register button in the "Tech on Tap is for you if" box.
    # start: "2027-01-21T17:00"
    # end: "2027-01-21T18:30"
    # register:
    #   label: "REGISTER NOW"
    #   eventbrite: { id: "EVENTBRITE-ID", url: "https://www.eventbrite.com/e/EVENTBRITE-LINK" }
    # Muted background loop behind the hero (clips from "Alpha Boyd Innovation Center 2").
    background:
      poster: ../assets/images/tech-on-tap/hero-video-poster.jpg
      small: /video/tech-on-tap-hero-720.mp4
      large: /video/tech-on-tap-hero-1080.mp4


